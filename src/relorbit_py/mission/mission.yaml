# mission.yaml — Planejamento de Missões RelOrbit
# Unidades: Geométricas (G=c=1) para órbitas; SI [kg, m/s, s] para massa e propulsão.
#           Atitude: unidades consistentes com o tensor de inércia (kg·m² + N·m + s).

missions:

  # ============================================================
  # MISSÃO 1: Transferência de Hohmann Relativística
  # Objetivo: Validar Manobras Impulsivas e Consumo de Massa (Item 4)
  # ============================================================
  - name: "Transferencia_Hohmann_Relativistica"
    description: "Descida de r=10M para r≈6M com duas queimas impulsivas"
    model: "schwarzschild_equatorial"
    params:
      M: 1.0
      E: 0.9435    # E circular r=10M
      L: 3.5136    # L circular r=10M
      capture_r: 2.05
      capture_eps: 1.0e-9
    state0: [10.0, 0.0]
    pr0: 0.0
    mass0:    1000.0
    dry_mass:  300.0
    isp_s:    3000.0
    span: [0.0, 600.0]
    solver:
      dt: 0.01
      record_every: 5
      maneuvers:
        - {tau: 50.0,  dv_r: 0.0, dv_phi: -0.10, dv_ms: 400.0}
        - {tau: 200.0, dv_r: 0.0, dv_phi: -0.08, dv_ms: 320.0}

  # ============================================================
  # MISSÃO 2: Exploração Kerr — Geodésica Pura
  # Objetivo: Frame-Dragging em Spin Alto (a=0.9)
  # ============================================================
  - name: "Exploracao_Kerr_Spin_Alto"
    model: "kerr_equatorial"
    params:
      M: 1.0
      a: 0.9
      E: 0.92
      L: 2.5
      capture_r: 1.5
    state0: [15.0, 0.0]
    pr0: -0.1
    mass0: 500.0
    dry_mass: 150.0
    span: [0.0, 1000.0]
    solver: {dt: 0.005, record_every: 20, maneuvers: []}

  # ============================================================
  # MISSÃO 3: Teste de Falha (Fuel Security)
  # Objetivo: Confirmar proteção contra Delta-v impossível
  # ============================================================
  - name: "Missao_Combustivel_Insuficiente"
    model: "schwarzschild_equatorial"
    params: {M: 1.0, E: 0.9435, L: 3.5136}
    state0: [10.0, 0.0]
    mass0: 200.0
    dry_mass: 150.0
    isp_s: 3000.0
    span: [0.0, 200.0]
    solver:
      dt: 0.01
      maneuvers:
        - {tau: 50.0, dv_r: 0.0, dv_phi: -0.10, dv_ms: 50000.0}

  # ============================================================
  # MISSÃO 4: Espiral de Escape em Kerr (Low-Thrust)
  # Objetivo: Validar Dinâmica Forçada 6D (Item 5)
  # ============================================================
  - name: "Espiral_Escape_Kerr_Forte"
    description: "Saída rápida r=10M→∞ com empuxo iônico constante"
    model: "kerr_lowthrust"
    params:
      M: 1.0
      a: 0.9
      E: 0.8932
      L: 3.1416
    state0: [10.0, 0.0]
    span: [0.0, 1500.0]
    solver: {dt: 0.01, record_every: 10}
    thrust:
      F_phi: 8.0e-4
      F_r:   0.0
      isp_s: 3000.0
      mass0_kg:    1000.0
      dry_mass_kg:  300.0
      tau_on:  0.0
      tau_off: 1500.0
      mode: "TANGENTIAL_ONLY"

  # ============================================================
  # MISSÃO 6: Targeting Numérico (Shooting Method - Item 6)
  # Objetivo: Atingir periapse alvo r=3M a partir de r=20M
  # ============================================================
  - name: "Targeting_Periapse_ISCO"
    description: "Cálculo de manobra para tangenciar a ISCO (r=3.0M)"
    model: "schwarzschild_equatorial"
    params:
      M: 1.0
      E: 0.974
      L: 4.300
    state0: [20.0, 0.0]
    target_rp: 3.0
    precision_goal: 0.001
    span: [0.0, 1200.0]
    solver:
      dt: 0.05
      record_every: 10
      maneuvers:
        - {tau: 0.1, dv_r: 0.0, dv_phi: -0.563212, dv_ms: 1850.0}

  # ============================================================
  # MISSÃO 7a: Atitude — Rotação Livre (Torque Nulo)
  # Objetivo: Critério (b) — T_rot conservada; critério (a) — ‖q‖ = 1
  # Corpo assimétrico: Ixx ≠ Iyy ≠ Izz  →  movimento de Euler não-trivial
  # ============================================================
  - name: "Atitude_Rotacao_Livre"
    description: >
      Corpo rígido assimétrico em rotação livre (sem torque).
      Valida conservação de energia rotacional e norma do quaternion.
    model: "attitude"
    inertia:
      Ixx: 100.0    # kg·m²
      Iyy: 200.0
      Izz: 150.0
    state0:
      q0: 1.0       # identidade — corpo alinhado com o inercial
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.1       # rad/s — rotação inicial em x
      wy: 0.05      # rad/s — componente cruzada → precessão de Euler
      wz: 0.0
    torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    span: [0.0, 200.0]
    solver:
      dt: 0.01
      record_every: 5
      renorm_every: 1
      renorm_tol: 1.0e-9

  # ============================================================
  # MISSÃO 7b: Atitude — Torque Impulsivo (Janela Curta)
  # Objetivo: Verificar resposta dinâmica a torque finito
  #           e retorno à conservação após t_off
  # ============================================================
  - name: "Atitude_Torque_Impulsivo"
    description: >
      Torque aplicado em [10s, 20s]; após t_off o corpo volta a girar
      livremente. Valida transição activo/inactivo e conservação posterior.
    model: "attitude"
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    state0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.05
      wy: 0.0
      wz: 0.0
    torque:
      tx:    0.0
      ty:    0.5    # N·m — torque no eixo y
      tz:    0.0
      t_on:  10.0
      t_off: 20.0
    span: [0.0, 100.0]
    solver:
      dt: 0.005
      record_every: 10
      renorm_every: 1
      renorm_tol: 1.0e-9

  # ============================================================
  # MISSÃO 7c: Atitude — Spin-up Contínuo
  # Objetivo: Massa nominal com torque constante durante toda a missão
  #           Verifica crescimento linear de ω e aumento de T_rot
  # ============================================================
  - name: "Atitude_Spinup_Continuo"
    description: >
      Torque constante em z durante toda a simulação.
      T_rot deve crescer; ‖q‖ deve permanecer = 1.
    model: "attitude"
    inertia:
      Ixx: 500.0
      Iyy: 500.0
      Izz: 200.0    # eixo de spin
    state0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.01
    torque:
      tx:    0.0
      ty:    0.0
      tz:    1.0    # N·m constante em z
      t_on:  0.0
      t_off: 60.0
    span: [0.0, 60.0]
    solver:
      dt: 0.01
      record_every: 10
      renorm_every: 1
      renorm_tol: 1.0e-9

  # ============================================================
  # MISSÃO 8a: Thrust Vectoring — Rotação Lenta (spin-stabilized)
  #
  # Objetivo: Validar acoplamento 6-DOF.
  #   - Nave em órbita elíptica em r=10M com spin ωz=0.05 rad/s
  #   - Motor a 50 N alinhado com bocal +z (eixo de spin)
  #   - Como a nave gira devagar, o empuxo precessa no plano equatorial
  #   - Resultado esperado: espiral de saída suave, variação de E e L
  #   - Critérios: ||q||=1, ε≈0 fora dos pulsos, massa decresce
  # ============================================================
  - name: "ThrustVectoring_SpinStabilized"
    description: >
      Nave em spin lento (wz=0.05 rad/s) com motor alinhado ao eixo de spin.
      O empuxo precessa no plano equatorial acoplado com a atitude.
      Valida acoplamento R(q)*k_body -> forca orbital.
    model: "schwarzschild_6dof"
    params:
      M: 1.0
      E: 0.9500
      L: 3.800
      capture_r: 2.1
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.05         # spin lento em z (rad/s)
    inertia:
      Ixx: 500.0       # kg·m²
      Iyy: 500.0
      Izz: 200.0       # eixo de spin mais leve
    engine:
      F_newton:    50.0         # [N]
      isp_s:       3000.0
      mass0_kg:    1000.0
      dry_mass_kg:  300.0
      nozzle_body: [0.0, 0.0, 1.0]   # bocal = eixo z do body
      tau_on:      0.0
      tau_off:     400.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    span: [0.0, 500.0]
    solver:
      dt:           0.005
      record_every: 20
      renorm_every: 1
      renorm_tol:   1.0e-9

  # ============================================================
  # MISSÃO 8b: Thrust Vectoring — Misalignment Crítico
  #
  # Objetivo: Demonstrar degradação quando o bocal não está alinhado.
  #   - Bocal rodado 30° em torno de x → componente de empuxo sai do
  #     plano equatorial (descartada no modelo 2D) → Δv efectivo < nominal
  #   - Nave começa sem spin para isolar o efeito do misalignment
  #   - Comparar com 8a: mesmo motor, menos Δv efectivo
  # ============================================================
  - name: "ThrustVectoring_Misalignment30deg"
    description: >
      Bocal rodado 30 graus em torno de x no body frame.
      Demonstra reducao de eficiencia: componente out-of-plane e descartada.
      Comparar massa consumida com ThrustVectoring_SpinStabilized.
    model: "schwarzschild_6dof"
    params:
      M: 1.0
      E: 0.9500
      L: 3.800
      capture_r: 2.1
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.0           # sem spin inicial — misalignment puro
    inertia:
      Ixx: 500.0
      Iyy: 500.0
      Izz: 200.0
    engine:
      F_newton:    50.0
      isp_s:       3000.0
      mass0_kg:    1000.0
      dry_mass_kg:  300.0
      # bocal a 30 graus de z para y: [0, sin30, cos30] = [0, 0.5, 0.866]
      nozzle_body: [0.0, 0.5, 0.866]
      tau_on:      0.0
      tau_off:     400.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    span: [0.0, 500.0]
    solver:
      dt:           0.005
      record_every: 20
      renorm_every: 1
      renorm_tol:   1.0e-9