# mission.yaml — Planejamento de Missões RelOrbit
# Unidades: Geométricas (G=c=1) para órbitas; SI [kg, m/s, s] para massa e propulsão.
#
# Campos de propulsão (opcionais):
#   mass0     — massa total inicial [kg] (sonda seca + combustível)
#   dry_mass  — massa seca [kg] (padrão: 30% de mass0)
#   isp_s     — impulso específico [s] (ausente → geodésica pura, sem consumo de massa)
#
# Campos de manobra:
#   tau       — tempo próprio da queima [M]
#   dv_r      — kick radial em pr = dr/dτ (adimensional em G=c=1)
#   dv_phi    — kick tangencial em L (momento angular específico, G=c=1)
#   dv_ms     — Δv físico para Tsiolkovsky [m/s] (opcional; estimado se ausente)
#
# Se dv_ms não for fornecido, é estimado como:
#   Δv_ms = sqrt((dv_r*c)² + (dv_phi*c/r_burn)²)   [pior caso relativístico]

missions:

  # ============================================================
  # Missão 1: Transferência de Hohmann Relativística
  # Saída da órbita circular em r=10M → descida até r≈6M (ISCO)
  #
  # Física da manobra:
  #   Burn 1 (τ=50): reduz L → inicia elipse de transferência
  #   Burn 2 (τ=150): reduz L novamente → circularização no periapse
  #
  # Parâmetros para órbita circular em r=10M (Schwarzschild):
  #   E_circ = (1-2M/r)/sqrt(1-3M/r) ≈ 0.9435
  #   L_circ = sqrt(M*r)/sqrt(1-3M/r) ≈ 3.5136
  # ============================================================
  - name: "Transferencia_Hohmann_Relativistica"
    description: "Saída de r=10M para r≈6M em Schwarzschild com queima de combustível"
    model: "schwarzschild_equatorial"
    params:
      M: 1.0
      E: 0.9435    # E circular r=10M
      L: 3.5136    # L circular r=10M
      capture_r: 2.05
      capture_eps: 1.0e-9
    state0: [10.0, 0.0]   # [r0, phi0]
    pr0: 0.0

    # Propulsão
    mass0:    1000.0   # [kg] massa total (seca + combustível)
    dry_mass:  300.0   # [kg] massa seca (padrão = 30%)
    isp_s:    3000.0   # [s]  impulso específico (v_eff ≈ 29.4 km/s)

    span: [0.0, 600.0]  # τ_ini=0, τ_fim=600M

    solver:
      dt: 0.01
      record_every: 5
      maneuvers:
        # Burn 1: kick retrógrado tangencial em τ=50 para iniciar descida
        - tau: 50.0
          dv_r: 0.0
          dv_phi: -0.10    # ΔL = -0.10 (reduz velocidade angular)
          dv_ms: 400.0     # Δv explícito [m/s] → consumo ≈ 12.4 kg a Isp=3000s

        # Burn 2: circularização próximo do periapse (~r=6M)
        - tau: 200.0
          dv_r: 0.0
          dv_phi: -0.08
          dv_ms: 320.0     # Δv explícito [m/s] → consumo ≈  9.9 kg

  # ============================================================
  # Missão 2: Exploração Kerr — órbita geodésica (sem propulsão)
  # Sonda entra em espiral ao redor de BN de Kerr com spin a=0.9
  # Sem manobras: trajetória puramente geodésica → isp_s ausente
  # ============================================================
  - name: "Exploracao_Kerr_Spin_Alto"
    description: "Aproximação geodésica em BN de Kerr com spin a=0.9M"
    model: "kerr_equatorial"
    params:
      M: 1.0
      a: 0.9
      E: 0.92
      L: 2.5
      capture_r: 1.5
      capture_eps: 1.0e-9
    state0: [15.0, 0.0]
    pr0: -0.1

    mass0:    500.0     # [kg] (geodésica pura — sem consumo)
    dry_mass: 150.0     # [kg]
    # isp_s ausente → sem propulsão, sem consumo de massa

    span: [0.0, 1000.0]
    solver:
      dt: 0.005
      record_every: 20
      maneuvers: []      # Órbita puramente geodésica

  # ============================================================
  # Missão 3: Teste de falha por combustível insuficiente
  # Δv muito alto para o combustível disponível — deve abortar
  # ============================================================
  - name: "Missao_Combustivel_Insuficiente"
    description: "Δv inviável — deve falhar com RuntimeError de combustível"
    model: "schwarzschild_equatorial"
    params:
      M: 1.0
      E: 0.9435
      L: 3.5136
      capture_r: 2.05
      capture_eps: 1.0e-9
    state0: [10.0, 0.0]
    pr0: 0.0

    mass0:    200.0    # [kg] massa total pequena
    dry_mass: 150.0    # [kg] massa seca → apenas 50 kg de combustível
    isp_s:    3000.0   # [s]

    span: [0.0, 200.0]
    solver:
      dt: 0.01
      record_every: 5
      maneuvers:
        - tau: 50.0
          dv_r: 0.0
          dv_phi: -0.10
          dv_ms: 50000.0   # 50 km/s — inviável com apenas 50 kg de combustível