[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "relorbit"
version = "1.1.9"
description = "Numerical simulation of spacecraft orbits in the relativistic regime near black holes. Includes Newtonian vs GR comparison, perihelion precession, ISCO, time dilation, and mission feasibility analysis. Implements geodesic integration, validation benchmarks, and visualization tools for field-strength scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.scikit-build]
# Onde está o pacote Python (src layout)
wheel.packages = ["src/relorbit_py"]

# Você pode ligar logs se der ruim:
# cmake.verbose = true
