project:
  name: relorbit
  repo: relativistic-spacecraft-orbits
  goal: >
    Motor híbrido C++ (Eigen) + Python para simulação de missões espaciais 6-DOF 
    em campos gravitacionais extremos (Newton, Schwarzschild e Kerr). 
    Foco em alta fidelidade física, análise de Monte Carlo e visualização relativística.

entrypoints:
  validate:
    cmd: python -m relorbit_py.validate
    cases: src/relorbit_py/cases.yaml
  mission_runner:
    cmd: python -m relorbit_py.run_mission
    config: src/relorbit_py/mission.yaml
    outputs:
      missions: out/missions/
      telemetry: out/missions/telemetry_plots/
      attitude: out/missions/attitude_plots/

models:
  orbital_physics:
    methods: [RK4 fixed-step, Eigen-optimized Geodesics]
    metrics: [Schwarzschild, Kerr Equatorial, Newton]
    invariants:
      - epsilon: pr² + Veff(r) - E² (Energy conservation)
      - carter_constant: (Para Kerr)
    diagnostics: [Redshift log-log, GR Visibility/Shadow events, Latency/dt_dtau]

  attitude_6dof (Item 7):
    engine: C++ Eigen-based Quaternion Integrator
    state: [q0, q1, q2, q3, wx, wy, wz]
    features:
      - Normalization: Controlled unit quaternion (drift < 1e-15)
      - Dynamics: Euler equations with inverse inertia tensor
      - Coupling: Support for Thrust Vectoring and Tidal Torques
    validation: [T_rot conservation, ‖q‖ error check]

  mission_analysis (Nova Camada):
    monte_carlo:
      goal: Uncertainty propagation and mission envelope safety
      inputs: [Gaussian noise on state0, Mass M, Thrust efficiency]
    visualization:
      engine: Relativistic Ray Tracing (Path Tracing ready)
      outputs: [Gravitational Lensing, Doppler Beaming, 6-DOF Spacecraft Render]

validation_targets:
  astrophysics:
    perihelion_precession: [Schwarzschild/Kerr vs Analytical]
    isco_stability: [Stability transition at r ~ 6M]
    frame_dragging: [Lense-Thirring effect in Kerr ergosphere]
  engineering:
    thrust_efficiency: [Mass budget vs Tsiolkovsky-GR]
    attitude_stability: [Drift monitoring in long-duration burns]