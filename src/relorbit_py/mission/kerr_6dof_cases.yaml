# kerr_6dof_cases.yaml
# Casos de teste para o modelo Kerr 6-DOF com torque de maré.
#
# Executar:
#   py -3 -m relorbit_py.mission.run_mission --yaml src/relorbit_py/mission/kerr_6dof_cases.yaml --out out/missions
#
# Casos:
#   1.  kerr_6dof_tidal_baseline       — sem torque tidal; T_rot deve ser constante
#   2.  kerr_6dof_weak_n               — WEAK_N: gravity-gradient clássico
#   3.  kerr_6dof_diag_eij             — DIAG_EIJ: quadrupolo + E_ij analítico
#   4.  kerr_6dof_riemann_fd           — RIEMANN_FD: Riemann numérico (modo monstro)
#   5.  kerr_6dof_riemann_fd_weakfield — campo fraco r=50M para validar convergência FD
#   6.  kerr_6dof_thrust_plus_tidal    — empuxo + maré acoplados
#   7.  kerr_raytracer_demo            — ray tracing de telemetria (geodésicas nulas Kerr)
#   ── Item 8: Acoplamento Órbita–Atitude via Thrust ──────────────────────────
#   8.  kerr_item8_geodesic_ref        — geodésica de referência (F=0)
#   9.  kerr_item8_radial_outward      — nozzle +r  (q=identidade)
#   10. kerr_item8_tangential          — nozzle +φ  (q=rotz 90°)
#   11. kerr_item8_radial_inward       — nozzle −r  (q=rotz 180°)
#
# NOTA Item 8:
#   a_geom_override = F/m = 30/1000 = 0.03 M⁻¹  (bypassa F/(m·c²_SI) que daria
#   a_geom ≈ 3×10⁻¹⁹ M⁻¹, i.e., 9×10¹⁶× menor — indetectável em τ=40 M).
#   tau_off = 40.2 M = T/4 (T≈160.8M) — evita cancelamento por averaging orbital.
#   validate_coupling.py verifica estes 4 casos de forma autónoma.

missions:

  # ── 1. Baseline: sem maré — T_rot deve ser constante ────────────
  - name: kerr_6dof_tidal_baseline
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.05
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
    span: [0.0, 500.0]
    solver:
      dt: 0.005
      record_every: 20
      renorm_every: 1
      renorm_tol: 1.0e-9

  # ── 2. Torque de maré WEAK_N ────────────────────────────────────
  # q = 45° em torno de y → n_body = [0.707, 0, 0.707] ≠ eixo principal.
  # Verificação: |τ_WEAK_N| = 3M/r³ * sin45°*cos45°*(Izz−Ixx) ≈ 1.5×10⁻¹ N·m @ r=10M
  - name: kerr_6dof_weak_n
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.9239
      q1: 0.0
      q2: 0.3827
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.0
    inertia:
      Ixx: 50.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: true
      model: WEAK_N
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 500.0]
    solver:
      dt: 0.005
      record_every: 20

  # ── 3. Torque de maré DIAG_EIJ ──────────────────────────────────
  - name: kerr_6dof_diag_eij
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.9
      E: 0.96
      L: 4.0
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.7071
      q1: 0.0
      q2: 0.7071
      q3: 0.0
      wx: 0.02
      wy: 0.0
      wz: 0.02
    inertia:
      Ixx: 50.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: true
      model: DIAG_EIJ
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: true
    span: [0.0, 500.0]
    solver:
      dt: 0.005
      record_every: 20

  # ── 4. RIEMANN_FD (modo monstro) ────────────────────────────────
  - name: kerr_6dof_riemann_fd
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.9659
      q1: 0.0
      q2: 0.2588
      q3: 0.0
      wx: 0.0
      wy: 0.01
      wz: 0.0
    inertia:
      Ixx: 50.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: true
      model: RIEMANN_FD
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 300.0]
    solver:
      dt: 0.005
      record_every: 20

  # ── 5. RIEMANN_FD campo fraco r=50M (validação E_ij ≈ diag) ─────
  - name: kerr_6dof_riemann_fd_weakfield
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.3
      E: 0.999
      L: 7.0
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [50.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.9239
      q1: 0.0
      q2: 0.3827
      q3: 0.0
      wx: 0.0
      wy: 0.005
      wz: 0.0
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: true
      model: RIEMANN_FD
      fd_eps_r: 1.0e-4
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 200.0]
    solver:
      dt: 0.01
      record_every: 10

  # ── 6. Kerr 6-DOF com empuxo + maré acoplados ───────────────────
  - name: kerr_6dof_thrust_plus_tidal
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.02
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 50.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 400.0
      torque_reaction: [0.0, 0.0, 0.0]
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: true
      model: DIAG_EIJ
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: true
    span: [0.0, 500.0]
    solver:
      dt: 0.005
      record_every: 20

  # ── 7. Ray Tracing de Telemetria (geodésicas nulas Kerr) ────────
  - name: kerr_raytracer_demo
    model: kerr_raytracer
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.02
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton: 0.0
      isp_s: 3000.0
      mass0_kg: 1000.0
      dry_mass_kg: 300.0
      nozzle_body: [0.0, 0.0, 1.0]
      tau_on: 0.0
      tau_off: 0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
    span: [0.0, 500.0]
    solver:
      dt: 0.005
      record_every: 20
    raytracer:
      receiver_r:       1000.0
      receiver_phi:     0.0
      n_images_max:     2
      n_lut:            1000
      n_steps:          12000
      dl_coarse:        0.5
      dl_fine:          0.05
      n_bisect:         50
      compute_redshift: true
      do_fan:           true

  # ════════════════════════════════════════════════════════════════
  # ITEM 8 — Acoplamento Órbita–Atitude via Thrust
  # ════════════════════════════════════════════════════════════════
  #
  # 4 missões explícitas (model: kerr_6dof).  Validadas por:
  #   py -3 validate_coupling.py
  #
  # Parâmetros comuns:
  #   M=1, a=0.5, E=0.95, L=3.8, r0=10M, pr0=0
  #   F_newton=30N, a_geom_override=0.03 M⁻¹ (=F/m, c=1)
  #   tau_off=40.2M (=T/4, T≈160.8M — evita averaging)
  #   nozzle_body=[1,0,0], mass0_kg=1000, dry_mass_kg=300, isp_s=3000
  #   tidal: desactivado (isola o efeito do thrust)
  #
  # Critérios de PASS (validate_coupling.py):
  #   ① thrust_phi_mean(tangential) > 1e-6  (direcção φ correcta)
  #   ② thrust_r_mean(radial_outward) > 1e-6  (direcção r correcta)
  #   ③ |ΔL(tangential)| > 0.05  (≈ 7.68 com estes parâmetros)
  #   ④ r_final(outward) ≠ r_final(tangential) ≠ r_final(inward)  (>0.01M)
  #   ⑤ efeitos opostos: r_out > r_geo > r_in  (outward expande, inward contrai)
  #   ⑥ ‖q‖−1 < 1e-6 para todos os casos

  # ── 8. Geodésica de referência (F=0) ────────────────────────────
  - name: kerr_item8_geodesic_ref
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0          # identidade — sem rotação
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.0
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton:        0.0   # motor DESLIGADO — geodésica pura
      a_geom_override: 0.0
      isp_s:           3000.0
      mass0_kg:        1000.0
      dry_mass_kg:     300.0
      nozzle_body:     [1.0, 0.0, 0.0]
      tau_on:          0.0
      tau_off:         0.0
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 40.2]
    solver:
      dt: 0.005
      record_every: 50

  # ── 9. Thrust radial outward (q = identidade) ───────────────────
  # nozzle_body=[1,0,0] + q=I  →  n_iner = R·[1,0,0] = [1,0,0]
  # Em φ=0: n_r=1, n_φ=0  →  dpr/dτ aumenta, dL/dτ ≈ 0
  - name: kerr_item8_radial_outward
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 1.0          # identidade: n_body=[1,0,0] → n_iner=[1,0,0] → thrust em +r
      q1: 0.0
      q2: 0.0
      q3: 0.0
      wx: 0.0
      wy: 0.0
      wz: 0.0
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton:        30.0
      a_geom_override: 0.03   # = F/m = 30/1000 M⁻¹  (bypassa F/(m*c²_SI))
      isp_s:           3000.0
      mass0_kg:        1000.0
      dry_mass_kg:     300.0
      nozzle_body:     [1.0, 0.0, 0.0]
      tau_on:          0.0
      tau_off:         40.2   # T/4 ≈ 40.2 M  (evita cancelamento por averaging)
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 40.2]
    solver:
      dt: 0.005
      record_every: 50

  # ── 10. Thrust tangencial (q = rotz 90°) ────────────────────────
  # nozzle_body=[1,0,0] + q=rotz(90°)  →  R·[1,0,0] = [0,1,0]
  # Em φ=0: n_r≈0, n_φ=1  →  dL/dτ >> 0  (maior acumulação de L)
  - name: kerr_item8_tangential
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.7071       # cos(45°) = rotz(90°): R·[1,0,0]=[0,1,0] → thrust em +φ
      q1: 0.0
      q2: 0.0
      q3: 0.7071       # sin(45°)
      wx: 0.0
      wy: 0.0
      wz: 0.0
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton:        30.0
      a_geom_override: 0.03
      isp_s:           3000.0
      mass0_kg:        1000.0
      dry_mass_kg:     300.0
      nozzle_body:     [1.0, 0.0, 0.0]
      tau_on:          0.0
      tau_off:         40.2
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 40.2]
    solver:
      dt: 0.005
      record_every: 50

  # ── 11. Thrust radial inward (q = rotz 180°) ────────────────────
  # nozzle_body=[1,0,0] + q=rotz(180°)  →  R·[1,0,0] = [-1,0,0]
  # Em φ=0: n_r=-1, n_φ≈0  →  dpr/dτ decresce (força de contração)
  # Esperado: r_final(inward) < r_final(geodesic) < r_final(outward)
  - name: kerr_item8_radial_inward
    model: kerr_6dof
    params:
      M: 1.0
      a: 0.5
      E: 0.95
      L: 3.8
      capture_r: 2.0
      capture_eps: 1.0e-12
    state0: [10.0, 0.0]
    pr0: 0.0
    attitude0:
      q0: 0.0          # cos(90°) = rotz(180°): R·[1,0,0]=[-1,0,0] → thrust em −r
      q1: 0.0
      q2: 0.0
      q3: 1.0          # sin(90°)
      wx: 0.0
      wy: 0.0
      wz: 0.0
    inertia:
      Ixx: 100.0
      Iyy: 200.0
      Izz: 150.0
    engine:
      F_newton:        30.0
      a_geom_override: 0.03
      isp_s:           3000.0
      mass0_kg:        1000.0
      dry_mass_kg:     300.0
      nozzle_body:     [1.0, 0.0, 0.0]
      tau_on:          0.0
      tau_off:         40.2
    ext_torque:
      tx: 0.0
      ty: 0.0
      tz: 0.0
    tidal:
      enabled: false
      model: NONE
      fd_eps_r: 1.0e-5
      Q_from_inertia: true
      spin_correction: false
    span: [0.0, 40.2]
    solver:
      dt: 0.005
      record_every: 50
