  # ============================================================
  # Suite: perihelion_precession
  # ============================================================
  perihelion_precession:
    cases:
      # ----- Órbita excêntrica: L=4.5, r0=20M -----
      # Δφ_exact ≈ 1.739 rad/órbita
      - name: schw_prec_moderate_M1_r20_E0p985_L4p5
        model: schwarzschild
        span: [0.0, 4200.0]
        solver:
          dt: 2.0e-3
          n_steps: 0
        params:
          M: 1.0
          E: 0.985
          L: 4.5
          capture_r: 2.5
          capture_eps: 1.0e-12
        state0: [20.0, 0.0]
        pr0: -0.15704298774539419
        criteria:
          constraint_abs_max: 5.0e-8
          status: BOUND
          must_have_events: [periapse]
          min_events: 7              # 4 periapses + 3 apoases
          require_tcoord: true
          require_vcoord: false
          time_A_min: 1.0e-6
          tcoord_monotone_tol: 0.0
          dt_dtau_rel_err_max: 2.0e-5
          dt_dtau_abs_err_max: 2.0e-3
          min_orbits_precession: 3
          precession_rel_err_max: 0.05       # 5% vs Δφ_exact (scipy); sem scipy: não reprova
          precession_consistency_max: 0.05   # std/|mean| < 5%

      # ----- Órbita excêntrica: L=4.0, r0=12M -----
      # Δφ_exact ≈ 2.883 rad/órbita
      - name: schw_prec_strong_M1_r12_E0p97_L4
        model: schwarzschild
        span: [0.0, 1700.0]
        solver:
          dt: 2.0e-3
          n_steps: 0
        params:
          M: 1.0
          E: 0.97
          L: 4.0
          capture_r: 2.5
          capture_eps: 1.0e-12
        state0: [12.0, 0.0]
        pr0: -0.12236859921595049
        criteria:
          constraint_abs_max: 8.0e-8
          status: BOUND
          must_have_events: [periapse]
          min_events: 7              # 4 periapses + 3 apoases
          require_tcoord: true
          require_vcoord: false
          time_A_min: 1.0e-6
          tcoord_monotone_tol: 0.0
          dt_dtau_rel_err_max: 2.0e-5
          dt_dtau_abs_err_max: 2.0e-3
          min_orbits_precession: 3
          precession_rel_err_max: 0.05
          precession_consistency_max: 0.05

  # ============================================================
  # Suite: isco
  # r_ISCO = 6M: r>6M → BOUND, r<6M → CAPTURE
  # ============================================================
  isco:
    cases:
      # ----- r = 6.2M: fora do ISCO → estável -----
      - name: schw_isco_stable_M1_r6p2
        model: schwarzschild
        span: [0.0, 300.0]
        solver:
          dt: 5.0e-4
          n_steps: 0
        params:
          M: 1.0
          E: 0.9429283659036918
          L: 3.465905365124674
          capture_r: 2.5
          capture_eps: 1.0e-6
        state0: [6.2, 0.0]
        pr0: -0.001
        criteria:
          constraint_abs_max: 1.0e-9
          status: BOUND
          must_have_events: [periapse]
          require_tcoord: true
          require_vcoord: false
          time_A_min: 1.0e-6
          tcoord_monotone_tol: 0.0
          dt_dtau_rel_err_max: 5.0e-5
          dt_dtau_abs_err_max: 5.0e-3
          isco_expected_stable: true

      # ----- r = 5.9M: dentro do ISCO → instável -----
      - name: schw_isco_unstable_M1_r5p9
        model: schwarzschild
        span: [0.0, 300.0]
        solver:
          dt: 5.0e-4
          n_steps: 0
        params:
          M: 1.0
          E: 0.9428965097881423
          L: 3.46459929513675
          capture_r: 2.5
          capture_eps: 1.0e-6
        state0: [5.9, 0.0]
        pr0: -0.01
        criteria:
          constraint_abs_max: 1.0e-7
          status: CAPTURE
          must_have_events: [horizon]
          require_tcoord: false
          require_vcoord: false
          time_A_min: 1.0e-2
          dt_dtau_rel_err_max: 1.0e+20
          dt_dtau_abs_err_max: 1.0e+20
          dv_dtau_rel_err_max: 1.0e+20
          dv_dtau_abs_err_max: 1.0e+20
          isco_expected_stable: false

# ============================================================
  # Suite: Kerr Equatorial (Frame Dragging)
  # Demonstra o acoplamento t-phi e a diferença prograde/retrograde
  # ============================================================
  kerr_equatorial:
    cases:
      # Órbita prógrada (L > 0) a favor do giro (a = 0.9). 
      # Espaço-tempo "ajuda" a estabilidade.
      - name: kerr_prograde_M1_a0p9_L3
        model: kerr_equatorial
        span: [0.0, 300.0]
        solver:
          dt: 5.0e-4
          n_steps: 0
        params:
          M: 1.0
          a: 0.9
          E: 0.95
          L: 3.0
          capture_r: 1.5   # O horizonte externo r_+ é ~1.436M para a=0.9
          capture_eps: 1.0e-6
        state0: [6.0, 0.0]
        pr0: -0.161992798  # Raiz exata da Hamiltoniana (dr/dtau < 0)
        criteria:
          constraint_abs_max: 1.0e-6
          status: BOUND
          require_tcoord: true
          require_vcoord: true
          dt_dtau_rel_err_max: 1.0e-3
          dt_dtau_abs_err_max: 1.0e-1

      # Mesmas condições, mas órbita retrógrada (L < 0). 
      # Espaço-tempo "puxa" contra, tornando a órbita instável nesta 
      # mesma distância (r=6M já é mortal para a retrógrada).
      - name: kerr_retrograde_M1_a0p9_Lminus3
        model: kerr_equatorial
        span: [0.0, 300.0]
        solver:
          dt: 5.0e-4
          n_steps: 0
        params:
          M: 1.0
          a: 0.9
          E: 0.95
          L: -3.0
          capture_r: 1.5
          capture_eps: 1.0e-6
        state0: [6.0, 0.0]
        pr0: -0.348197741  # Raiz exata da Hamiltoniana (dr/dtau < 0)
        criteria:
          constraint_abs_max: 1.0e-5
          status: CAPTURE
          must_have_events: [horizon]
          require_tcoord: false
          require_vcoord: false
          dt_dtau_rel_err_max: 1.0e+20
          dt_dtau_abs_err_max: 1.0e+20